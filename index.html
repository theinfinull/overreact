<!doctype html>
<html lang="en" class="booting">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Overreact | Build Your Own React</title>
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/fonts/caveat.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/hero-background.jpg" as="image" />
        <link rel="preload" href="/hero-mascot.svg" as="image" />
        <link rel="stylesheet" href="/src/index.css" />
        <style>
            html.booting {
                overflow: hidden;
            }
            #boot-screen {
                position: fixed;
                inset: 0;
                z-index: 100;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 0.85rem;
                background: #11110f;
                color: #ffffff;
                font-family: "Space Grotesk", sans-serif;
                font-weight: 600;
                transition: opacity 0.45s ease;
            }
            #boot-screen.is-done {
                opacity: 0;
                pointer-events: none;
            }
            #boot-screen img {
                width: 2.25rem;
                height: 2.25rem;
            }
            #boot-screen .boot-pulse {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 0.7rem;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: #c2c2bc;
            }
            #boot-screen .boot-dot {
                position: relative;
                width: 0.5rem;
                height: 0.5rem;
                flex-shrink: 0;
            }
            #boot-screen .boot-dot::before,
            #boot-screen .boot-dot::after {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: 999px;
                background: #a86ff7;
            }
            #boot-screen .boot-dot::before {
                opacity: 0.7;
                animation: boot-ping 1.2s cubic-bezier(0, 0, 0.2, 1) infinite;
            }
            @keyframes boot-ping {
                75%,
                100% {
                    transform: scale(2.2);
                    opacity: 0;
                }
            }
        </style>
    </head>
    <body>
        <div id="boot-screen" aria-live="polite" aria-busy="true">
            <img src="/overreact.svg" alt="" />
            <span>Overreact</span>
            <span class="boot-pulse">
                <span class="boot-dot" aria-hidden="true"></span>
                Loading
            </span>
        </div>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
